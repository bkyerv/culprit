<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0b0c0e">
    <meta name="description" content="Culprit re-executes failed agent runs to prove which step caused the failure.">
    <title>Culprit · Run investigation</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="app"></div>
    <noscript>Culprit requires JavaScript to replay this investigation.</noscript>
    <!-- CULPRIT_BOOTSTRAP -->
    <script>
      (() => {
        if (location.protocol !== "file:") {
          const module = document.createElement("script");
          module.type = "module";
          module.src = "./app.js";
          document.body.append(module);
          return;
        }

        const load = (src) => new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.body.append(script);
        });

        load("./mock-data.js")
          .then(() => load("./ui.js"))
          .then(() => window.CulpritUI.boot(window.CulpritMockData.createDataSource()))
          .catch(() => {
            document.querySelector("#app").textContent = "Could not load the local Culprit replay.";
          });
      })();
    </script>
  </body>
</html>
