[project]
name = "culprit-control"
version = "0.0.0"
description = "Culprit trusted control plane and live UI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "google-cloud-firestore>=2.20,<3",
  "google-cloud-secret-manager>=2.23,<3",
  "google-cloud-storage>=3,<4",
  "google-cloud-tasks>=2.19,<3",
  "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
