[project]
name = "culprit-runner"
version = "0.0.0"
description = "Culprit isolated agent recording runner"
requires-python = ">=3.12"
dependencies = [
  "culprit-core",
  "fastapi>=0.115,<1",
  "google-adk>=1.0,<2",
  "google-cloud-firestore>=2.20,<3",
  "google-cloud-storage>=3,<4",
  "google-cloud-tasks>=2.19,<3",
  "google-genai>=1.0,<2",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.34,<1",
  "zstandard>=0.23,<1",
]

[project.scripts]
culprit-record = "culprit_runner.cli:main"

[tool.uv.sources]
culprit-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
