[project]
name = "culprit-runner"
version = "0.0.0"
description = "Culprit sandbox probe runner"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "google-cloud-storage>=3,<4",
  "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
