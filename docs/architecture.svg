<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Culprit Google Cloud architecture and trust boundary</title>
  <desc id="desc">A public authenticated control service enqueues Cloud Tasks across a hard trust boundary to an internal runner. The runner uses Vertex AI and credential-free Cloud Run sandboxes. Firestore and Cloud Storage hold evidence. Cloud Build and Artifact Registry supply both services.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .zone { fill: #fff; stroke: #555; stroke-width: 1.5; }
      .boundary { stroke: #111; stroke-width: 4; }
      .node { fill: #fff; stroke: #333; stroke-width: 1.5; }
      .denied { fill: #f6f6f6; stroke: #333; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .edge { fill: none; stroke: #333; stroke-width: 1.5; marker-end: url(#arrow); }
      .blocked { fill: none; stroke: #333; stroke-width: 1.5; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .zone-title { font-family: Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #111; letter-spacing: .4px; }
      .main-title { font-family: Arial, sans-serif; font-size: 27px; font-weight: 600; fill: #111; }
      .label { font-family: Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #111; text-anchor: middle; }
      .detail { font-family: Arial, sans-serif; font-size: 14px; fill: #333; text-anchor: middle; }
      .edge-label { font-family: Arial, sans-serif; font-size: 13px; fill: #222; text-anchor: middle; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #333; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#fff"/>
  <text class="main-title" x="45" y="45">Culprit architecture · two Cloud Run services, one hard trust boundary</text>

  <rect class="node" x="45" y="215" width="210" height="90"/>
  <text class="label" x="150" y="250">Browser</text>
  <text class="detail" x="150" y="276">Culprit UI</text>

  <rect class="zone" x="300" y="95" width="400" height="390"/>
  <text class="zone-title" x="320" y="128">PUBLIC TRUSTED CONTROL PLANE</text>
  <text class="detail" x="500" y="153">No subject code execution</text>
  <rect class="node" x="345" y="205" width="310" height="115"/>
  <text class="label" x="500" y="240">culprit-control · Cloud Run</text>
  <text class="detail" x="500" y="266">FastAPI · REST + SSE · Basic Auth</text>
  <text class="detail" x="500" y="290">public ingress · reads evidence</text>
  <rect class="node" x="385" y="370" width="230" height="75"/>
  <text class="label" x="500" y="401">Secret Manager</text>
  <text class="detail" x="500" y="426">culprit-basic-auth</text>

  <rect class="node" x="735" y="205" width="165" height="115"/>
  <text class="label" x="817" y="240">Cloud Tasks</text>
  <text class="detail" x="817" y="266">3-way fan-out</text>
  <text class="detail" x="817" y="290">retry/rate policy</text>

  <line class="boundary" x1="935" y1="75" x2="935" y2="500"/>
  <text class="zone-title" x="955" y="102">HARD TRUST BOUNDARY</text>
  <text class="small" x="955" y="126">Only Cloud Tasks OIDC requests cross</text>

  <rect class="zone" x="975" y="145" width="580" height="340"/>
  <text class="zone-title" x="995" y="178">INTERNAL EXECUTION PLANE</text>
  <text class="detail" x="1265" y="201">Cloud Run internal ingress only</text>
  <rect class="node" x="1015" y="230" width="300" height="110"/>
  <text class="label" x="1165" y="265">culprit-runner · Cloud Run gen2</text>
  <text class="detail" x="1165" y="291">Google ADK fleet · effect broker</text>
  <text class="detail" x="1165" y="315">sandbox launcher enabled</text>
  <rect class="node" x="1350" y="230" width="165" height="110"/>
  <text class="label" x="1432" y="265">Vertex AI</text>
  <text class="detail" x="1432" y="291">gemini-3.7-flash</text>
  <text class="detail" x="1432" y="315">global</text>
  <rect class="node" x="1015" y="380" width="300" height="75"/>
  <text class="label" x="1165" y="411">Cloud Run sandbox</text>
  <text class="detail" x="1165" y="436">workspace + allowed tool execution</text>
  <rect class="denied" x="1350" y="380" width="165" height="75"/>
  <text class="label" x="1432" y="411">DENIED</text>
  <text class="detail" x="1432" y="436">egress · env · metadata</text>

  <path class="edge" d="M255 260 H345"/>
  <text class="edge-label" x="300" y="247">HTTPS · Basic Auth</text>
  <path class="edge" d="M500 370 V320"/>
  <text class="edge-label" x="573" y="349">credential version</text>
  <path class="edge" d="M655 262 H735"/>
  <text class="edge-label" x="695" y="249">enqueue only</text>
  <path class="edge" d="M900 262 H1015"/>
  <text class="edge-label" x="957" y="249">OIDC</text>
  <path class="edge" d="M1315 285 H1350"/>
  <text class="edge-label" x="1332" y="273">ADK</text>
  <path class="edge" d="M1165 340 V380"/>
  <text class="edge-label" x="1244" y="366">sandbox CLI</text>
  <path class="blocked" d="M1315 417 H1350"/>

  <rect class="zone" x="300" y="555" width="1255" height="245"/>
  <text class="zone-title" x="320" y="588">MANAGED STATE</text>
  <text class="detail" x="927" y="612">Control reads · runner writes · browser never receives database credentials</text>
  <rect class="node" x="485" y="655" width="330" height="100"/>
  <text class="label" x="650" y="691">Firestore</text>
  <text class="detail" x="650" y="717">runs · events · effects</text>
  <text class="detail" x="650" y="739">branches · grades</text>
  <rect class="node" x="1040" y="655" width="330" height="100"/>
  <text class="label" x="1205" y="691">Cloud Storage</text>
  <text class="detail" x="1205" y="717">checkpoint tars · artifacts · diffs</text>
  <text class="detail" x="1205" y="739">native ADK evalsets</text>

  <path class="edge" d="M455 485 V530 H650 V655"/>
  <path class="edge" d="M545 485 V515 H1205 V655"/>
  <path class="edge" d="M1115 485 V625 H755 V655"/>
  <path class="edge" d="M1215 485 V655"/>

  <rect class="zone" x="300" y="835" width="1255" height="110"/>
  <text class="zone-title" x="320" y="868">BUILD SUPPLY CHAIN</text>
  <rect class="node" x="590" y="858" width="180" height="65"/>
  <text class="label" x="680" y="886">Cloud Build</text>
  <text class="detail" x="680" y="908">builds two images</text>
  <rect class="node" x="930" y="858" width="220" height="65"/>
  <text class="label" x="1040" y="886">Artifact Registry</text>
  <text class="detail" x="1040" y="908">control + runner images</text>
  <path class="edge" d="M770 890 H930"/>
  <text class="edge-label" x="850" y="878">push</text>
  <text class="detail" x="1340" y="886">Images deploy to both Cloud Run services</text>

  <text class="detail" x="800" y="980">Every outward action is brokered in simulate/replay mode. No real email, payment, message, or calendar effect occurs.</text>
</svg>
